@if (products().length) {
  <div class="product-list">
    @for (product of products(); track product.id) {
      <app-product-card
        [product]="product"
        (edit)="onProductEdit($event)"
        (delete)="onProductDelete($event)"
      />
    }
  </div>
} @else {
  <div class="product-list__empty">
    <h2>No products yet</h2>
    <p>Add a product to start building the vending machine inventory.</p>
  </div>
}
