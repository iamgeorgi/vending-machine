<section class="vending-machine">
  <header class="vending-machine__header">
    <div>
      <span class="vending-machine__eyebrow"> Self-service vending </span>
      <h1>Choose your product</h1>
      <p>Insert coins, select a product and receive your change automatically.</p>
    </div>
  </header>
  <div class="vending-machine__transaction">
    <app-coin-selector [coins]="acceptedCoins" (coinInserted)="onCointInserted($event)" />
    <app-transaction-summary
      [insertedAmount]="vendingStore.insertedAmount()"
      [returnedCoins]="vendingStore.lastChange()"
      [error]="vendingStore.error()"
      /* (reset)="vendingStore.reset()" */
    />
  </div>

  @if (productsStore.loading()) {
    <div class="state-message">Loading products...</div>
  } @else if (productsStore.error()) {
    <div class="state-message state-message--error" role="alert">
      {{ productsStore.error() }}
    </div>
  } @else {
    <app-vending-product-list
      [products]="productsStore.products()"
      (buyProduct)="onBuyProduct($event)"
    />
  }
</section>
