@if (products().length) {
  <div class="vending-product-list">
    @for (product of products(); track product.id) {
      <app-vending-product-card [product]="product" (buyProduct)="onBuyProduct($event)" />
    }
  </div>
} @else {
  <div class="vending-product-list__empty">
    <h2>No products yet</h2>
    <p>Add a product to start building the vending machine inventory.</p>
  </div>
}
